<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title desc">
<title id="title">Screening outcome definition and descriptive denominators</title><desc id="desc">A schematic two-by-two matrix crosses examination status and reported history. Exam-positive with no history reported defines previously unreported. Examination-positive proportions and previously-unreported proportions require different eligible denominators. Missing fields are audited separately; the constructed outcome is not proof of diagnostic error.</desc>
<g font-family="Avenir Next, Avenir, Arial, sans-serif"><rect x="0" y="0" width="1440" height="970" rx="0" fill="#F2F6FA" stroke="none"/><text x="64" y="89" font-size="59" fill="#123B56" font-weight="600" text-anchor="start">An outcome is a comparison.</text><text x="66" y="143" font-size="28" fill="#536C7C" font-weight="400" text-anchor="start">Define the examination/history relationship before estimating associations.</text><text x="498" y="224" font-size="29" fill="#123B56" font-weight="600" text-anchor="middle">History reported</text><text x="1063" y="224" font-size="29" fill="#123B56" font-weight="600" text-anchor="middle">No history reported</text><text x="68" y="321" font-size="29" fill="#123B56" font-weight="600" text-anchor="start">Exam</text><text x="68" y="363" font-size="29" fill="#123B56" font-weight="600" text-anchor="start">positive</text><text x="68" y="510" font-size="29" fill="#123B56" font-weight="600" text-anchor="start">Exam</text><text x="68" y="552" font-size="29" fill="#123B56" font-weight="600" text-anchor="start">negative</text><rect x="236" y="256" width="528" height="172" rx="12" fill="#FFFFFF" stroke="none"/><text x="270" y="314" font-size="31" fill="#123B56" font-weight="600" text-anchor="start">Exam positive</text><text x="270" y="360" font-size="27" fill="#536C7C" font-weight="400" text-anchor="start">History reported</text><rect x="792" y="256" width="584" height="172" rx="12" fill="#176F74" stroke="none"/><text x="827" y="314" font-size="34" fill="#FFFFFF" font-weight="600" text-anchor="start">Previously unreported</text><text x="827" y="361" font-size="26" fill="#FFFFFF" font-weight="400" text-anchor="start">Exam positive + no history reported</text><rect x="236" y="452" width="528" height="172" rx="12" fill="#FFFFFF" stroke="none"/><text x="270" y="510" font-size="31" fill="#123B56" font-weight="600" text-anchor="start">Exam negative</text><text x="270" y="556" font-size="27" fill="#536C7C" font-weight="400" text-anchor="start">History reported</text><rect x="792" y="452" width="584" height="172" rx="12" fill="#FFFFFF" stroke="none"/><text x="827" y="510" font-size="31" fill="#123B56" font-weight="600" text-anchor="start">Exam negative</text><text x="827" y="556" font-size="27" fill="#536C7C" font-weight="400" text-anchor="start">No history reported</text><text x="236" y="663" font-size="23" fill="#536C7C" font-weight="400" text-anchor="start">Categories are schematic. Cell sizes do not represent sample sizes.</text><path d="M64 701 L1376 701" fill="none" stroke="#C7D7E0" stroke-width="2" stroke-dasharray=""/><text x="66" y="754" font-size="28" fill="#123B56" font-weight="600" text-anchor="start">Examination-positive proportion</text><text x="66" y="796" font-size="25" fill="#536C7C" font-weight="400" text-anchor="start">Positive examinations / eligible records</text><text x="66" y="834" font-size="25" fill="#536C7C" font-weight="400" text-anchor="start">with a known examination outcome</text><text x="792" y="754" font-size="28" fill="#176F74" font-weight="600" text-anchor="start">Previously-unreported proportion</text><text x="792" y="796" font-size="25" fill="#536C7C" font-weight="400" text-anchor="start">Previously unreported / exam-positive records</text><text x="792" y="834" font-size="25" fill="#536C7C" font-weight="400" text-anchor="start">with known reported-history status</text><rect x="64" y="872" width="1312" height="65" rx="8" fill="#DFEFEE" stroke="none"/><text x="88" y="913" font-size="25" fill="#123B56" font-weight="400" text-anchor="start">Reported-history discordance is not proof of diagnostic error. Audit missing fields separately.</text></g></svg>