<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">Clinical screening: from records to interpretable evidence</title><desc id="desc">Examination findings and reported history are reconciled into analytical outcomes. The workflow audits the cohort, defines outcomes, and models associations. This illustration contains no study results.</desc>
<g font-family="Avenir Next, Avenir, Arial, sans-serif"><rect x="0" y="0" width="1440" height="720" rx="0" fill="#F2F6FA" stroke="none"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#176F74" stroke="none"/><text x="76" y="83" font-size="27" fill="#176F74" font-weight="600" text-anchor="start">Clinical screening analytics</text><text x="72" y="193" font-size="76" fill="#123B56" font-weight="600" text-anchor="start">From records</text><text x="72" y="283" font-size="76" fill="#123B56" font-weight="600" text-anchor="start">to interpretable</text><text x="72" y="373" font-size="76" fill="#123B56" font-weight="600" text-anchor="start">evidence.</text><text x="76" y="446" font-size="29" fill="#536C7C" font-weight="400" text-anchor="start">Reconcile examination findings</text><text x="76" y="490" font-size="29" fill="#536C7C" font-weight="400" text-anchor="start">with reported history.</text><rect x="782" y="66" width="592" height="470" rx="24" fill="#FFFFFF" stroke="none"/><text x="824" y="118" font-size="25" fill="#536C7C" font-weight="500" text-anchor="start">Two sources. One analytical definition.</text><rect x="824" y="154" width="508" height="92" rx="10" fill="#F2F6FA" stroke="none"/><path d="M851 176 H879 V225 H851 Z M859 187 H871 M859 198 H871 M859 209 H871" fill="none" stroke="#123B56" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="905" y="211" font-size="29" fill="#123B56" font-weight="600" text-anchor="start">Examination findings</text><rect x="824" y="274" width="508" height="92" rx="10" fill="#F2F6FA" stroke="none"/><path d="M851 296 H879 V345 H851 Z M859 307 H871 M859 318 H871 M859 329 H871" fill="none" stroke="#123B56" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="905" y="330" font-size="29" fill="#123B56" font-weight="600" text-anchor="start">Reported history</text><path d="M1332 200 H1350 V393 H1090 V419" fill="none" stroke="#176F74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1332 320 H1350" fill="none" stroke="#176F74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1082 409 L1090 419 L1098 409" fill="none" stroke="#176F74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="824" y="430" width="508" height="68" rx="10" fill="#176F74" stroke="none"/><text x="1078" y="474" font-size="29" fill="#FFFFFF" font-weight="600" text-anchor="middle">Reconciled outcomes</text><path d="M76 574 L1364 574" fill="none" stroke="#C7D7E0" stroke-width="2" stroke-dasharray=""/><text x="76" y="622" font-size="29" fill="#123B56" font-weight="600" text-anchor="start">Audit the cohort</text><text x="76" y="661" font-size="24" fill="#536C7C" font-weight="400" text-anchor="start">Eligibility and denominators</text><text x="523" y="622" font-size="29" fill="#123B56" font-weight="600" text-anchor="start">Define the outcome</text><text x="523" y="661" font-size="24" fill="#536C7C" font-weight="400" text-anchor="start">Examination + reported history</text><text x="988" y="622" font-size="29" fill="#123B56" font-weight="600" text-anchor="start">Model associations</text><text x="988" y="661" font-size="24" fill="#536C7C" font-weight="400" text-anchor="start">Adjustment and uncertainty</text><text x="76" y="702" font-size="20" fill="#536C7C" font-weight="400" text-anchor="start">Public methods illustration; no study results shown.</text></g></svg>