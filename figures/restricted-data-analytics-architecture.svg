    <circle cx="897" cy="349" r="21" fill="#A7C7C5"/><path d="M887 348h20M897 338v20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="932" y="342" fill="#31535C" font-size="15" font-weight="700">Adjusted model &amp; checks</text><text x="932" y="364" fill="#667C80" font-size="12">uncertainty • diagnostics • interpretation</text>
  </g>
  <g filter="url(#shadow)"><rect x="52" y="491" width="526" height="172" rx="18" fill="#FFF4EF"/><rect x="622" y="491" width="526" height="172" rx="18" fill="#EDFAF6"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="82" y="521" width="112" height="25" rx="12" fill="#F4C8BA"/><text x="97" y="539" fill="#9A4734" font-size="12" font-weight="700" letter-spacing=".9">PRIVATE</text>
    <text x="82" y="579" fill="#8D4534" font-size="21" font-weight="700">Protected within the authorized environment</text>
    <text x="82" y="607" fill="#8A6157" font-size="14">Raw records • direct identifiers • source fields • counts • results</text>
    <text x="82" y="631" fill="#8A6157" font-size="14">Never committed, linked, or reproduced publicly</text>
    <rect x="652" y="521" width="106" height="25" rx="12" fill="#BEE8D9"/><text x="669" y="539" fill="#16715F" font-size="12" font-weight="700" letter-spacing=".9">PUBLIC</text>
    <text x="652" y="579" fill="#176859" font-size="21" font-weight="700">Shared as portfolio-safe evidence</text>
    <text x="652" y="607" fill="#467A70" font-size="14">Generic R workflow • methods • architecture • privacy boundary</text>
    <text x="652" y="631" fill="#467A70" font-size="14">Demonstrates analytical rigor without revealing the underlying study</text>
  </g>
</svg>
