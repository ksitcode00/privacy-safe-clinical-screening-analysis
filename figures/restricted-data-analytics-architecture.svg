    <text x="688" y="342" fill="#31535C" font-size="15" font-weight="700">Outcome construction</text><text x="688" y="364" fill="#667C80" font-size="12">generic analytic variables</text>
    <path d="M794 352H840" stroke="#8BA3A4" stroke-width="2.5"/><path d="M831 344l9 8-9 8" fill="none" stroke="#8BA3A4" stroke-width="2.5"/>
