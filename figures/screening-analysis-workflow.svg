<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
<title id="title">Clinical screening analysis with branch-specific eligible cohorts</title><desc id="desc">After cohort auditing, descriptive analysis uses records with known outcomes and exact binomial intervals. Adjusted logistic regression uses exam-positive records with complete covariates and includes diagnostic checks. Interpretation considers selection and avoids causal claims. Only generic methods and code are public.</desc>
<g font-family="Avenir Next, Avenir, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1010" rx="0" fill="#F2F6FA" stroke="none"/><text x="64" y="90" font-size="55" fill="#123B56" font-weight="600" text-anchor="start">Every estimate needs the right cohort.</text><text x="66" y="145" font-size="29" fill="#536C7C" font-weight="400" text-anchor="start">Keep descriptive eligibility and modeling eligibility explicit.</text><rect x="64" y="187" width="1312" height="123" rx="14" fill="#123B56" stroke="none"/><text x="99" y="237" font-size="33" fill="#FFFFFF" font-weight="600" text-anchor="start">Audit and reconcile records</text><text x="99" y="280" font-size="27" fill="#FFFFFF" font-weight="400" text-anchor="start">Apply eligibility filters   /   Remove duplicate records   /   Check missing fields</text><path d="M720 310 V345 M389 345 H1051" fill="none" stroke="#176F74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M389 345 L389 381" fill="none" stroke="#176F74" stroke-width="3" stroke-dasharray=""/><path d="M381 373 L389 381 L397 373" fill="none" stroke="#176F74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1051 345 L1051 381" fill="none" stroke="#176F74" stroke-width="3" stroke-dasharray=""/><path d="M1043 373 L1051 381 L1059 373" fill="none" stroke="#176F74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="391" width="650" height="302" rx="14" fill="#FFFFFF" stroke="none"/><text x="98" y="445" font-size="33" fill="#123B56" font-weight="600" text-anchor="start">Describe screening outcomes</text><text x="98" y="494" font-size="27" fill="#536C7C" font-weight="400" text-anchor="start">Eligible records with known outcomes</text><text x="98" y="546" font-size="27" fill="#123B56" font-weight="400" text-anchor="start">Reconcile numerator and denominator</text><text x="98" y="590" font-size="27" fill="#123B56" font-weight="400" text-anchor="start">Estimate proportions with exact</text><text x="98" y="629" font-size="27" fill="#123B56" font-weight="400" text-anchor="start">binomial confidence intervals</text><rect x="752" y="391" width="624" height="302" rx="14" fill="#FFFFFF" stroke="none"/><text x="786" y="445" font-size="31" fill="#176F74" font-weight="600" text-anchor="start">Estimate adjusted associations</text><text x="786" y="494" font-size="26" fill="#536C7C" font-weight="400" text-anchor="start">Exam-positive, complete-covariate records</text><text x="786" y="546" font-size="27" fill="#123B56" font-weight="400" text-anchor="start">Fit a logistic-regression model</text><text x="786" y="590" font-size="27" fill="#123B56" font-weight="400" text-anchor="start">Review model diagnostics and</text><text x="786" y="629" font-size="27" fill="#123B56" font-weight="400" text-anchor="start">odds ratios with confidence intervals</text><path d="M389 693 V731 H1051 V693 M720 731 V762" fill="none" stroke="#176F74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M712 752 L720 762 L728 752" fill="none" stroke="#176F74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="778" width="1312" height="116" rx="12" fill="#DFEFEE" stroke="none"/><text x="98" y="824" font-size="31" fill="#123B56" font-weight="600" text-anchor="start">Communicate the interpretation boundary</text><text x="98" y="866" font-size="27" fill="#123B56" font-weight="400" text-anchor="start">Selection can change the sample. Adjusted associations do not establish causation.</text><text x="66" y="945" font-size="26" fill="#123B56" font-weight="600" text-anchor="start">Public evidence: generalized R code and methods.</text><text x="66" y="982" font-size="24" fill="#536C7C" font-weight="400" text-anchor="start">Restricted records, counts and model estimates remain outside this repository.</text></g></svg>